services:
  - type: web
    name: patel-store
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn eshopping.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: ADMIN_USERNAME
        value: teerthpatel
      - key: ADMIN_PASSWORD
        value: teerth2611
      - key: ADMIN_EMAIL
        value: teerthpatel@example.com
